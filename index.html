<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenon MacKinnon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, ::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --red: #C41E2A; --black: #1a1a1a; --near-white: #FAFAF8; }
    html { background-color: var(--near-white); }
    body { background-color: var(--near-white); color: var(--black); font-family: 'EB Garamond', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 1.1rem; line-height: 1.8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 1.5rem; }
    main { width: 100%; max-width: 580px; border: 1.5px solid var(--red); padding: 2.8rem 3rem; }
    header { margin-bottom: 2rem; padding-bottom: 1.6rem; border-bottom: 1px solid var(--red); box-shadow: 0 3px 0 0 var(--red); }
    h1 { font-size: 1.75rem; font-weight: 500; letter-spacing: 0.03em; color: var(--black); }
    .rubric { display: block; margin-top: 0.5rem; color: var(--red); font-size: 0.8rem; letter-spacing: 0.18em; font-variant: small-caps; text-transform: lowercase; }
    p { margin-bottom: 0; color: var(--black); }
    a { color: var(--red); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 2rem; padding-top: 1.4rem; border-top: 1px solid var(--red); font-size: 0.88rem; color: var(--red); font-variant: small-caps; letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Zenon MacKinnon</h1>
      <span class="rubric">San Francisco</span>
    </header>

    <p>A playwright and a scholar of chant and sacred music. I live and work in San Francisco. Please get in touch.</p>

    <footer>
      <a href="mailto:zenonmackinnon@gmail.com">zenonmackinnon@gmail.com</a>
    </footer>
  </main>
</body>
</html>
